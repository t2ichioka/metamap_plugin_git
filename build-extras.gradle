
dependencyResolutionManagement {
    repositories {
        flatDir {
            dirs 'libs'
        }
        maven {
            url = uri(flatDir.resolve("maven-repository"))
        }
    }
}

dependencies {
    val metamapVersion = flatDir.resolve("VERSION").readText().trim()
    implementation("jp.metamaps.positioning:metamap-mapview:$metamapVersion")
}