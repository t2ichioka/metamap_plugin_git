ext.postBuildExtras = {
    allprojects {
        repositories {
             google()
             mavenCentral()
             maven {
                 url = uri("${rootDir.absolutePath}/app/sdk/maven-repository")
            }
        }
    }
    dependencies {
        val metamapVersion = file("${rootDir.absolutePath}/app/sdk/VERSION").readText().trim()
        implementation("jp.metamaps.positioning:metamap-mapview:$metamapVersion")
    }
}