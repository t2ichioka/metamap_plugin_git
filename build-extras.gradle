ext.postBuildExtras = {
    def versionFile = new File("${rootDir.absolutePath}/app/libs/sdk", "VERSION")

    allprojects {
        repositories {
             google()
             mavenCentral()
             maven {
                 url = uri("${rootDir.absolutePath}/app/libs/sdk/maven-repository")
            }
        }
    }
    dependencies {
        def metamapVersion = versionFile.text.trim()
        implementation("jp.metamaps.positioning:metamap-mapview:$metamapVersion")
    }
}